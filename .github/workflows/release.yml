name: Release

on:
  push:
    branches: [dist]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("latest.json"))["versionName"])')
          CODE=$(python3 -c 'import json; print(json.load(open("latest.json"))["versionCode"])')
          TAG="android-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi
          gh release create "$TAG" \
            neon-bastion.apk \
            latest.json \
            --title "Neon Bastion ${VERSION}" \
            --notes "Signed Android client ${VERSION} (build ${CODE}). Installs over the previous signed Neon Bastion build."
